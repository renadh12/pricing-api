server:
  port: 8080

spring:
  application:
    name: pricing-api
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 100
        max-idle: 50
        min-idle: 10
        max-wait: 1000ms
  websocket:
    message-size-limit: 128KB
    send-buffer-size-limit: 512KB
    send-time-limit: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      simple:
        enabled: true

logging:
  level:
    com.pricing: INFO
    org.springframework.data.redis: WARN